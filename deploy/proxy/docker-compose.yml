services:
  caddy:
    image: caddy:2
    container_name: crm-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - crm-proxy

networks:
  crm-proxy:
    external: true

volumes:
  caddy_data:
  caddy_config:
