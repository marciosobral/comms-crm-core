name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @comms-core/validation build
      - name: Generate Prisma client
        run: pnpm --filter @comms-core/api exec prisma generate
        env:
          # prisma.config.ts requires it; generate never connects.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_API_URL: https://api.example.com
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
